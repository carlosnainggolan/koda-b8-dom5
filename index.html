<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="input-field">
        <input type="password" id="password" placeholder="password">
        <span>
            <i id="toggle-password" class="bi bi-eye-slash" style="cursor: pointer;"></i>
        </span>
    </form>

    <script>
        let password = document.getElementById("password");
        let toggler = document.getElementById("toggle-password");

        toggler.addEventListener("click", function hideShowPassword() {
            if (password.type === "password") {
                password.setAttribute("type", "text");
                toggler.classList.remove("bi-eye-slash");
                toggler.classList.add("bi-eye");
            } else {
                password.setAttribute("type", "password");
                toggler.classList.remove("bi-eye");
                toggler.classList.add("bi-eye-slash");
            }
        }); 

        
    </script>
</body>
</html>
